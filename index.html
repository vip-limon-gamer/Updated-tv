    <style>
        :root { --bg-color: #05050a; --cyan: #00ffff; --purple: #b026ff; --red: #ff003c; --glass-bg: rgba(10, 10, 20, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        body { background: var(--bg-color); color: #fff; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(circle at 20% 30%, rgba(176, 38, 255, 0.12), transparent 40%), radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.12), transparent 40%); animation: bgPulse 10s infinite alternate ease-in-out; }
        @keyframes bgPulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        header { text-align: center; padding: 2rem; border-bottom: 2px solid var(--purple); box-shadow: 0 0 20px var(--purple); background: var(--glass-bg); backdrop-filter: blur(10px); }
        .neon-title { font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan), 0 0 40px var(--purple); letter-spacing: 3px; margin-bottom: 0.5rem; }
        .header-link { color: var(--cyan); text-decoration: none; font-size: 0.9rem; text-shadow: 0 0 5px var(--cyan); transition: 0.3s; font-weight: bold; }
        .header-link:hover { color: var(--red); text-shadow: 0 0 10px var(--red); }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; flex: 1; width: 100%; }
        .video-wrapper { position: relative; width: 100%; max-width: 850px; margin: 0 auto 2.5rem; border: 2px solid var(--cyan); box-shadow: 0 0 30px rgba(0, 255, 255, 0.2); border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; }
        video { width: 100%; display: block; aspect-ratio: 16/9; }
        .player-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(5, 5, 10, 0.95) 80%, rgba(5, 5, 10, 0.4) 30%, transparent); padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; opacity: 0; transition: opacity 0.4s ease-in-out; pointer-events: auto; z-index: 10; }
        .video-wrapper:hover .player-controls, .video-wrapper.active-controls .player-controls { opacity: 1; }
        .timeline-container { display: flex; align-items: center; width: 100%; height: 8px; cursor: pointer; }
        .timeline { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); position: relative; transition: height 0.1s; border-radius: 2px; }
        .timeline-container:hover .timeline { height: 6px; }
        .buffered-bar { position: absolute; left: 0; top: 0; height: 100%; background: rgba(255, 255, 255, 0.3); width: 0%; }
        .play-bar { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, var(--purple), var(--red)); width: 0%; }
        .play-bar::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%) scale(0); width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px var(--red); transition: transform 0.1s; }
        .timeline-container:hover .play-bar::after { transform: translateY(-50%) scale(1); }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .control-left, .control-right { display: flex; align-items: center; gap: 15px; }
        .p-btn { background: transparent; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .p-btn:hover { color: var(--cyan); filter: drop-shadow(0 0 5px var(--cyan)); }
        .volume-block { display: flex; align-items: center; gap: 8px; }
        .volume-slider { -webkit-appearance: none; appearance: none; width: 0; height: 4px; background: rgba(255,255,255,0.25); outline: none; transition: width 0.3s ease; opacity: 0; border-radius: 2px; }
        .volume-block:hover .volume-slider, .volume-slider:focus { width: 70px; opacity: 1; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--cyan); cursor: pointer; border-radius: 50%; box-shadow: -70px 0 0 70px var(--cyan); }
        .volume-slider::-moz-range-thumb { width: 12px; height: 12px; background: var(--cyan); cursor: pointer; border-radius: 50%; border: none; }
        .volume-slider::-moz-range-progress { background: var(--cyan); height: 4px; }
        .time-display { font-size: 0.8rem; color: #ccc; letter-spacing: 1px; font-weight: 400; }
        .search-container { text-align: center; margin-bottom: 2.5rem; }
        .search-bar { width: 100%; max-width: 500px; padding: 14px; background: rgba(5, 5, 10, 0.8); border: 1px solid var(--purple); color: var(--cyan); font-size: 1.1rem; border-radius: 4px; outline: none; transition: 0.3s; box-shadow: 0 0 15px rgba(176, 38, 255, 0.2); text-align: center; }
        .search-bar:focus { border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 255, 255, 0.4); }
        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .channel-card { background: rgba(20, 20, 30, 0.7); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; backdrop-filter: blur(5px); }
        .channel-card img { max-width: 100%; height: 75px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
        .channel-card h3 { font-size: 0.9rem; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .channel-card:hover { transform: translateY(-4px) scale(1.02); border-color: var(--purple); box-shadow: 0 0 20px rgba(176, 38, 255, 0.4); }
        .channel-card.active { border-color: var(--cyan); animation: activeGlow 1.5s infinite alternate; }
        .channel-card.active h3 { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
        @keyframes activeGlow { 0% { box-shadow: 0 0 10px var(--cyan); } 100% { box-shadow: 0 0 25px var(--cyan), 0 0 12px var(--red); } }
        .status-msg { text-align: center; color: var(--red); font-size: 1.2rem; margin-top: 2rem; text-shadow: 0 0 5px var(--red); }
        footer { text-align: center; padding: 1.5rem; border-top: 2px solid var(--red); background: var(--glass-bg); box-shadow: 0 -5px 20px rgba(255, 0, 60, 0.2); margin-top: auto; }
        footer p { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); font-size: 0.9rem; }
        @media (max-width: 600px) { .neon-title { font-size: 2rem; } .channel-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; } .player-controls { padding: 8px; gap: 5px; } .p-btn { font-size: 0.9rem; } }
    </style>
